[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openai-image-generator"
version = "0.1.0"
description = "PySide6 desktop image generator for OpenAI-compatible APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "qasync>=0.27",
  "httpx>=0.27",
  "platformdirs>=4.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-httpx>=0.30",
  "pytest-qt>=4.4",
  "pyinstaller>=6.8",
  "ruff>=0.5"
]

[project.scripts]
openai-image-generator = "image_generator.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
